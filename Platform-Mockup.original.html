let lang="ar",theme="nile",active="home",opsSection=0,financeDemo=false,caseStage=0;
function t(){return translations[lang]}function toggleLang(){lang=lang==="ar"?"en":"ar";document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";render()}
function setTheme(v){theme=v;document.body.classList.toggle("editorial",v==="editorial");document.getElementById("nileBtn").classList.toggle("active",v==="nile");document.getElementById("editorialBtn").classList.toggle("active",v==="editorial")}
function showPage(v){active=v;render();window.scrollTo({top:0,behavior:"smooth"})}
function nav(){document.getElementById("tabs").innerHTML=t().tabs.map(([id,label])=>`<button class="tab ${active===id?'active':''}" onclick="showPage('${id}')">${label}</button>`).join("")}
function stepsHTML(arr){return `<div class="timeline">${arr.map((x,i)=>`<div class="event ${i>0?'pending':''}"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join("")}</div>`}
function home(){return `<section class="hero"><div><div class="eyebrow">${t().eyebrow}</div><h1>${t().hero}</h1><p>${t().heroDesc}</p><div class="head-actions" style="margin-top:24px"><button class="btn" onclick="showPage('assessment')">${t().heroCTA}</button><button class="btn quiet" onclick="document.getElementById('specialties').scrollIntoView({behavior:'smooth'})">${t().heroSecondary}</button></div></div><div class="hero-art"><div class="eyebrow" style="color:#E6C5A4">${t().brand}</div><div class="big">${t().heroArt}</div><p style="color:#fff">${t().heroArtSub}</p><span class="small">01 / 05 — ${t().medical}</span></div></section><hr class="rule"><section id="specialties"><div class="eyebrow">${t().specialties}</div><h2 class="section-title">${t().specialties}</h2><p class="section-intro">${t().specialtyIntro}</p><div class="grid">${t().items.map((x,i)=>`<div class="lineitem"><strong>${String(i+1).padStart(2,'0')}　${x}</strong><span>${lang==='ar'?'مراجعة الخيارات بعد التقييم الطبي':'Options reviewed after medical assessment'}</span></div>`).join("")}</div></section><hr class="rule"><section><div class="eyebrow">${t().process}</div><h2 class="section-title">${t().process}</h2><p class="section-intro">${t().processDesc}</p><div class="grid">${t().steps.map((x,i)=>`<div class="lineitem"><span>${String(i+1).padStart(2,'0')}</span><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join("")}</div></section><div class="alert">${t().emergency}</div>`}
function assessment(){return `<div class="columns"><section><div class="eyebrow">${t().eyebrow}</div><h1 class="section-title">${t().assessmentTitle}</h1><p class="section-intro">${t().assessmentDesc}</p><div class="alert">${t().emergency}</div><p class="muted small">${t().notSent}</p></section><form class="panel" onsubmit="event.preventDefault();document.getElementById('demoMsg').classList.remove('hidden')"><div class="field"><label>${t().name}</label><input required placeholder="${t().name}"></div><div class="field"><label>${t().country}</label><select><option>${lang==='ar'?'السعودية':'Saudi Arabia'}</option><option>${lang==='ar'?'الإمارات':'United Arab Emirates'}</option><option>${lang==='ar'?'الكويت':'Kuwait'}</option><option>${lang==='ar'?'قطر':'Qatar'}</option><option>${lang==='ar'?'البحرين':'Bahrain'}</option><option>${lang==='ar'?'عُمان':'Oman'}</option><option>${lang==='ar'?'أخرى':'Other'}</option></select></div><div class="field"><label>${t().contact}</label><input required placeholder="${t().contact}"></div><div class="field"><label>${t().specialty}</label><select>${t().items.map(x=>`<option>${x}</option>`).join("")}<option>${lang==='ar'?'غير متأكد':'Not sure'}</option></select></div><label style="display:flex;gap:10px;align-items:flex-start;font-size:13px;margin:12px 0"><input type="checkbox" required style="margin-top:6px"> ${t().consent}</label><button class="btn" type="submit">${t().send}</button><p id="demoMsg" class="alert hidden">${t().notSent}</p></form></div>`}
function portal(){return `<div class="eyebrow">${t().portalTitle}</div><h1 class="section-title">${t().portalTitle}</h1><p class="section-intro">${t().portalDesc}</p><div class="statrow"><div class="stat"><span>${t().current}</span><b style="font-size:18px">${t().inReview}</b></div><div class="stat"><span>${t().next}</span><b style="font-size:18px">${lang==='ar'?'تواصل المنسق':'Coordinator contact'}</b></div><div class="stat"><span>${t().documents}</span><b style="font-size:18px">${lang==='ar'?'بانتظار الاستكمال':'Awaiting completion'}</b></div><div class="stat"><span>${t().messages}</span><b style="font-size:18px">—</b></div></div><div class="columns"><div class="panel"><h3>${t().next}</h3><p>${t().nextDesc}</p><button class="btn secondary" onclick="showPage('journey')">${t().journeyTitle}</button></div><div class="panel"><h3>${t().companion}</h3><p>${t().companionDesc}</p><button class="btn quiet" onclick="alert(${JSON.stringify(t().notSent)})">${lang==='ar'?'معاينة دعوة مرافق':'Preview companion invite'}</button></div></div>`}
function journey(){return `<div class="eyebrow">${t().journeyTitle}</div><h1 class="section-title">${t().journeyTitle}</h1><p class="section-intro">${t().journeyDesc}</p><div class="columns"><div>${stepsHTML(t().timeline)}</div><aside><div class="panel"><h3>${lang==='ar'?'معلومات الرحلة':'Journey details'}</h3><p><span class="muted">${t().status}:</span> <span class="tag warn">${t().inReview}</span></p><p><span class="muted">${t().owner}:</span> —</p><p><span class="muted">${lang==='ar'?'تاريخ السفر':'Travel date'}:</span> —</p><div class="alert">${t().gate}</div><button class="btn secondary" onclick="showPage('portal')">${t().portalTitle}</button></div></aside></div>`}
function compare(){return `<div class="eyebrow">${t().compareTitle}</div><h1 class="section-title">${t().compareTitle}</h1><p class="section-intro">${t().compareDesc}</p><div style="overflow:auto"><table><thead><tr>${[t().provider,t().plan,t().included,t().price,t().payment,t().validity].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody><tr><td>—<br><span class="muted small">${lang==='ar'?'مقدم خدمة معتمد':'Verified provider'}</span></td><td>${lang==='ar'?'بعد اعتماد المختص':'After clinical approval'}</td><td>${lang==='ar'?'وفق العرض':'Per quotation'}</td><td>—</td><td>${lang==='ar'?'محدد لكل بند':'Per line item'}</td><td>—</td></tr><tr><td>—</td><td>${lang==='ar'?'خيار بديل عند ملاءمته طبيًا':'Alternative if clinically appropriate'}</td><td>${lang==='ar'?'موضح في العرض':'Listed in quotation'}</td><td>—</td><td>${lang==='ar'?'مريض / شركة حسب الاتفاق':'Patient / company per agreement'}</td><td>—</td></tr></tbody></table></div><div class="alert">${t().disclosure}</div><p class="muted small">${lang==='ar'?'لا توجد مستشفيات أو أسعار أو تقييمات مختلقة في هذا النموذج.':'No invented hospitals, prices or ratings are used in this mockup.'}</p>`}
function followup(){return `<div class="eyebrow">${t().followTitle}</div><h1 class="section-title">${t().followTitle}</h1><p class="section-intro">${t().followDesc}</p><div class="grid">${t().followSteps.map((x,i)=>`<div class="lineitem"><span>${String(i+1).padStart(2,'0')}</span><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join("")}</div><div class="alert">${t().emergency}</div>`}
function ops(){
 const section=t().opsSections[opsSection];
 let detail='';
 if(opsSection===0){detail=`<h3>${t().case}</h3><div class="mini-grid"><div class="mini-field"><label>${t().caseFields[0]}</label><input value="${t().caseId}" readonly></div><div class="mini-field"><label>${t().caseFields[1]}</label><select><option>${lang==='ar'?'غير معيّن':'Unassigned'}</option><option>${lang==='ar'?'منسق تجريبي':'Demo coordinator'}</option></select></div><div class="mini-field"><label>${t().caseFields[2]}</label><select><option>${t().priority}</option><option>${lang==='ar'?'عالية':'High'}</option><option>${lang==='ar'?'عاجلة':'Urgent'}</option></select></div><div class="mini-field"><label>${t().caseFields[3]}</label><input value="—" readonly></div></div><hr class="rule"><h3>${t().caseStageLabel}</h3><p><span class="tag warn">${t().stageNames[caseStage]}</span></p><div class="progress"><span style="width:${Math.round((caseStage+1)/t().stageNames.length*100)}%"></span></div><div class="workspace-actions"><button class="btn" onclick="advanceCase()">${t().advance}</button><button onclick="resetCase()">${lang==='ar'?'إعادة ضبط':'Reset demo'}</button></div><div id="opsNotice" class="notice">${t().stageGuard}</div>`}
 else if(opsSection===1){detail=`<h3>${section}</h3><div class="mini-grid"><div class="mini-field"><label>${t().fileStatus}</label><select><option>${lang==='ar'?'بانتظار المستندات':'Awaiting documents'}</option><option>${lang==='ar'?'مكتمل للمراجعة':'Complete for review'}</option></select></div><div class="mini-field"><label>${t().reviewer}</label><select><option>${lang==='ar'?'غير معيّن':'Not assigned'}</option><option>${lang==='ar'?'مراجع مخوّل تجريبي':'Demo authorized reviewer'}</option></select></div><div class="mini-field"><label>${t().reviewStatus}</label><select><option>${t().pending}</option><option>${lang==='ar'?'قيد المراجعة':'Under review'}</option><option>${lang==='ar'?'يحتاج معلومات إضافية':'More information needed'}</option></select></div><div class="mini-field"><label>${t().documents}</label><input value="${lang==='ar'?'لا توجد ملفات مرفقة':'No files attached'}" readonly></div></div><div class="alert">${t().clinicalGate}</div><div class="notice">${t().demoOnly}</div>`}
 else if(opsSection===2){detail=`<h3>${section}</h3><div class="mini-grid"><div class="mini-field"><label>${t().providerStatus}</label><select><option>${lang==='ar'?'لم يتم الاختيار':'Not selected'}</option><option>${lang==='ar'?'بانتظار التحقق':'Verification pending'}</option><option>${lang==='ar'?'تم التحقق (تجريبي)':'Verified (demo)'}</option></select></div><div class="mini-field"><label>${t().quoteStatus}</label><select><option>${lang==='ar'?'لم يُنشأ عرض':'No quote created'}</option><option>${lang==='ar'?'مسودة':'Draft'}</option><option>${lang==='ar'?'بانتظار الاعتماد':'Awaiting approval'}</option></select></div><div class="mini-field"><label>${lang==='ar'?'العملة':'Currency'}</label><select><option>EGP</option><option>USD</option><option>SAR</option><option>AED</option></select></div><div class="mini-field"><label>${lang==='ar'?'صلاحية العرض':'Quote expiry'}</label><input type="date"></div></div><div class="alert">${t().disclosure}</div>`}
 else if(opsSection===3){detail=`<h3>${section}</h3><div class="mini-grid"><div class="mini-field"><label>${t().bookingStatus}</label><select><option>${lang==='ar'?'غير محجوز':'Not booked'}</option><option>${lang==='ar'?'قيد التنسيق':'Being coordinated'}</option><option>${lang==='ar'?'مؤكد (تجريبي)':'Confirmed (demo)'}</option></select></div><div class="mini-field"><label>${lang==='ar'?'تاريخ الوصول':'Arrival date'}</label><input type="date"></div><div class="mini-field"><label>${lang==='ar'?'الإقامة':'Accommodation'}</label><select><option>${lang==='ar'?'غير محددة':'Not specified'}</option><option>${lang==='ar'?'بانتظار التأكيد':'Awaiting confirmation'}</option></select></div><div class="mini-field"><label>${lang==='ar'?'الانتقالات':'Transfers'}</label><select><option>${lang==='ar'?'غير محددة':'Not specified'}</option><option>${lang==='ar'?'بانتظار التأكيد':'Awaiting confirmation'}</option></select></div></div><h4>${t().readiness}</h4><label><input type="checkbox"> ${lang==='ar'?'تأكيد المستندات المطلوبة':'Required documents confirmed'}</label><br><label><input type="checkbox"> ${lang==='ar'?'تأكيد الخدمات والحجوزات':'Services and bookings confirmed'}</label><div class="alert">${t().clinicalGate}</div>`}
 else if(opsSection===4){detail=`<h3>${section}</h3><p>${t().financeDesc}</p><button class="btn secondary" onclick="showPage('finance')">${t().financeTitle}</button><div class="notice">${lang==='ar'?'تُسجل المدفوعات والاستردادات وتسويات الموردين كسجلات منفصلة.':'Payments, refunds and supplier settlements should be recorded separately.'}</div>`}
 else {detail=`<h3>${t().auditTitle}</h3><div class="timeline">${t().auditItems.map((x,i)=>`<div class="event ${i?'pending':''}"><h4>${x}</h4><p>${lang==='ar'?'سجل توضيحي غير قابل للاعتماد':'Illustrative, non-authoritative entry'}</p></div>`).join('')}</div><div class="notice">${t().demoOnly}</div>`}
 return `<div class="eyebrow">${t().opsTitle}</div><h1 class="section-title">${t().opsTitle}</h1><p class="section-intro">${t().opsDesc}</p><div class="layout"><aside class="side">${t().opsSections.map((x,i)=>`<button class="${i===opsSection?'active':''}" onclick="selectSide(${i})">${x}</button>`).join('')}</aside><section><div class="panel"><div class="head" style="padding-top:0"><div><div class="eyebrow">${section}</div><span class="muted small">${t().caseId}</span></div><span class="tag warn">${t().status}</span></div>${detail}<div class="workspace-actions"><button onclick="showPage('finance')">${t().financeTitle}</button><button onclick="showPage('journey')">${t().journeyTitle}</button></div></div></section></div>`
}
function finance(){const show=financeDemo;const vals=show?(lang==='ar'?['120,000 ج.م','82,000 ج.م','38,000 ج.م','15,000 ج.م']:['EGP 120,000','EGP 82,000','EGP 38,000','EGP 15,000']):[t().empty,t().empty,t().empty,t().empty];return `<div class="eyebrow">${t().financeTitle}</div><h1 class="section-title">${t().financeTitle}</h1><p class="section-intro">${t().financeDesc}</p>${show?`<div class="notice">${t().demoLabel}</div>`:''}<div class="statrow">${[t().revenue,t().cost,t().margin,t().due].map((x,i)=>`<div class="stat"><span>${x}</span><b>${vals[i]}</b>${show&&i===2?`<span class="metric-note">${lang==='ar'?'قبل المصروفات العامة والضرائب':'Before overhead and taxes'}</span>`:''}</div>`).join('')}</div><div class="workspace-actions"><button class="btn secondary" onclick="toggleFinanceDemo()">${show?t().hideDemo:t().showDemo}</button></div><div style="overflow:auto;margin-top:18px"><table><thead><tr>${t().tableHead.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${t().financeRows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="alert">${t().financeNote}</div><div class="notice">${t().currency} · ${t().demoOnly}</div>`}
function advanceCase(){if(caseStage>=3){document.getElementById('opsNotice').textContent=t().stageGuard;return;}caseStage++;render();}
function resetCase(){caseStage=0;opsSection=0;render();}
function toggleFinanceDemo(){financeDemo=!financeDemo;render();}
function selectSide(i){opsSection=i;render();}
function render(){let x=t();document.getElementById("topLabel").textContent=x.top;document.getElementById("brandSub").textContent=x.brand;document.getElementById("modeTag").textContent=x.mode;document.getElementById("headerCta").textContent=x.cta;document.getElementById("footerNote").textContent=x.footer;document.getElementById("langBtn").textContent=lang==="ar"?"English":"العربية";document.getElementById("nileBtn").textContent=lang==="ar"?"أخضر النيل":"Nile Green";document.getElementById("editorialBtn").textContent=lang==="ar"?"تحريري طبي":"Medical Editorial";nav();const views={home,assessment,portal,journey,compare,followup,ops,finance};document.getElementById("content").innerHTML=views[active]()}
render();
</script></body></html>
