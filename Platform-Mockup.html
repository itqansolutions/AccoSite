<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardiac Journey & Accommodation — Platform Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #F3EDE2;
  --surface: #FBF8F1;
  --paper: #FBF8F2;
  --ink: #1A1F1D;
  --muted: #566058;
  --primary: #0F4C45;
  --accent: #B4532A;
  --line: #D6CCB8;
  --soft: #E7DFCF;
  --danger: #B42318;
  --warn: #9A6700;
  --good: #24704E;
  --fd: 'Readex Pro', 'IBM Plex Sans Arabic', sans-serif;
  --fb: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body.editorial {
  --bg: #FAF8F4;
  --surface: #FFFFFF;
  --paper: #FFFFFF;
  --ink: #14161A;
  --muted: #55585E;
  --primary: #14161A;
  --accent: #C23B2E;
  --line: #DAD5CA;
  --soft: #EFEBE2;
  --danger: #B42318;
  --warn: #9A6700;
  --good: #24704E;
  --fd: 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', sans-serif;
  --fb: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

html[dir="ltr"] {
  --fd: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fb: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--fb);
  font-size: 16px;
  line-height: 1.7;
  transition: background-color 0.25s ease, color 0.25s ease;
}

h1, h2, h3, h4, .brand, .hero-art .big, .section-title {
  font-family: var(--fd);
  font-weight: 600;
  letter-spacing: -0.015em;
}

button, input, select, textarea {
  font-family: var(--fb);
  font-size: 15px;
}
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* Top Notice & Global Controls */
.top {
  background: var(--ink);
  color: var(--bg);
  padding: 10px 4vw;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}
.switches {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.switches button, .themebtn {
  border: 1px solid currentColor;
  background: transparent;
  color: inherit;
  padding: 5px 12px;
  font-size: 12px;
  border-radius: 2px;
  transition: background 0.2s, color 0.2s;
}
.switches button.active {
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
}

/* Shell & Layout */
.shell {
  max-width: 1320px;
  margin: auto;
  padding: 20px 4vw 60px;
}

/* Header */
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 0 20px;
  border-bottom: 1px solid var(--line);
}
.brand {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.2;
  cursor: pointer;
}
.brand small {
  display: block;
  font-family: var(--fb);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.08em;
  margin-top: 3px;
}
.head-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

/* Navigation Bar */
.main-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  position: relative;
  background: var(--bg);
}
.nav-links {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  padding: 10px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.nav-links::-webkit-scrollbar { display: none; }
.nav-btn {
  white-space: nowrap;
  border: 0;
  background: transparent;
  padding: 8px 14px;
  color: var(--muted);
  font-weight: 500;
  font-size: 14px;
  border-radius: 2px;
  transition: color 0.15s, background 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover {
  color: var(--ink);
  background: var(--soft);
}
.nav-btn.active {
  background: var(--ink);
  color: var(--paper);
  font-weight: 600;
}
body.editorial .nav-btn.active {
  background: var(--primary);
}

/* Mobile Hamburger Toggle */
.mobile-toggle {
  display: none;
  background: transparent;
  border: 1px solid var(--line);
  padding: 7px 12px;
  font-size: 14px;
  border-radius: 2px;
}

/* Dropdown Menu for Specialties */
.dropdown-wrap {
  position: relative;
  display: inline-block;
}
.dropdown-menu {
  display: none;
  position: absolute;
  top: 100%;
  inset-inline-start: 0;
  background: var(--paper);
  border: 1px solid var(--line);
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  min-width: 280px;
  z-index: 100;
  padding: 6px 0;
}
.dropdown-wrap:hover .dropdown-menu,
.dropdown-menu.show {
  display: block;
}
.dropdown-item {
  display: block;
  padding: 9px 16px;
  font-size: 13.5px;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  transition: background 0.15s;
}
.dropdown-item:last-child { border-bottom: 0; }
.dropdown-item:hover { background: var(--soft); }

/* Buttons */
.btn {
  border: 1px solid var(--primary);
  background: var(--primary);
  color: #FFFFFF;
  padding: 11px 20px;
  font-weight: 600;
  font-size: 14.5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 2px;
  transition: background 0.2s, border-color 0.2s, transform 0.1s;
  min-height: 44px;
}
.btn:hover {
  background: color-mix(in srgb, var(--primary) 85%, #000);
}
.btn:active {
  transform: translateY(1px);
}
.btn.secondary {
  background: transparent;
  color: var(--primary);
  border-color: var(--primary);
}
.btn.secondary:hover {
  background: var(--soft);
}
.btn.quiet {
  border-color: var(--line);
  background: transparent;
  color: var(--ink);
}
.btn.quiet:hover {
  background: var(--soft);
}

body.editorial .btn:not(.quiet):not(.secondary) {
  background: var(--accent);
  border-color: var(--accent);
}
body.editorial .btn.secondary {
  color: var(--accent);
  border-color: var(--accent);
}

/* Content Area */
.page {
  padding: 28px 0 40px;
}

/* Typography elements */
.eyebrow {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 8px;
}
.section-title {
  font-size: clamp(24px, 3.2vw, 38px);
  line-height: 1.25;
  margin: 0 0 10px;
  color: var(--primary);
}
.section-intro {
  color: var(--muted);
  max-width: 780px;
  margin: 0 0 28px;
  font-size: 16px;
  line-height: 1.7;
}
.rule {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 32px 0;
}

/* Hero Section */
.hero {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 36px;
  align-items: stretch;
  padding: 16px 0 36px;
}
.hero h1 {
  font-size: clamp(28px, 4vw, 50px);
  line-height: 1.2;
  margin: 12px 0 20px;
  max-width: 760px;
  color: var(--primary);
}
.hero p {
  font-size: 17px;
  max-width: 660px;
  color: var(--ink);
  margin: 0 0 28px;
  line-height: 1.7;
}
.hero-art {
  background: var(--primary);
  color: #FFFFFF;
  min-height: 320px;
  padding: 32px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  border-radius: 2px;
}
.hero-art:after {
  content: "";
  position: absolute;
  width: 340px;
  height: 340px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 50%;
  right: -80px;
  top: 50px;
  box-shadow: 0 0 0 40px rgba(255, 255, 255, 0.05), 0 0 0 85px rgba(255, 255, 255, 0.03);
}
html[dir="ltr"] .hero-art:after {
  right: auto;
  left: -80px;
}
.hero-art > * {
  position: relative;
  z-index: 1;
}
.hero-art .big {
  font-size: 28px;
  line-height: 1.35;
  max-width: 380px;
  font-weight: 600;
}
body.editorial .hero-art {
  background: var(--primary);
}

/* Grids and Columns */
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
}
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
.lineitem {
  padding: 16px 0;
  border-top: 1px solid var(--line);
}
.lineitem strong {
  display: block;
  font-size: 16.5px;
  font-family: var(--fd);
  margin-bottom: 4px;
}
.lineitem span {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
}

/* Panels and Cards */
.panel {
  border: 1px solid var(--line);
  padding: 24px;
  background: var(--paper);
  border-radius: 2px;
}
.panel h3 {
  margin: 0 0 12px;
  font-size: 19px;
  color: var(--primary);
}

/* Card Links */
.card-link {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid var(--line);
  padding: 22px;
  background: var(--paper);
  text-decoration: none;
  color: inherit;
  border-radius: 2px;
  transition: border-color 0.2s, background 0.2s;
}
.card-link:hover {
  border-color: var(--primary);
  background: var(--surface);
}

/* Forms */
.field {
  display: grid;
  gap: 6px;
  margin-bottom: 18px;
}
.field label {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
}
.field input, .field select, .field textarea {
  border: 1px solid var(--line);
  background: var(--paper);
  padding: 12px 14px;
  width: 100%;
  color: var(--ink);
  border-radius: 2px;
  font-size: 15.5px;
  transition: border-color 0.2s, outline 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--primary);
  outline-offset: -1px;
}
.field textarea {
  min-height: 100px;
  resize: vertical;
}

/* Tags and Badges */
.tag {
  display: inline-block;
  border: 1px solid var(--line);
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 2px;
}
.tag.good {
  color: var(--good);
  border-color: color-mix(in srgb, var(--good) 40%, var(--line));
  background: color-mix(in srgb, var(--good) 8%, transparent);
}
.tag.warn {
  color: var(--warn);
  border-color: color-mix(in srgb, var(--warn) 40%, var(--line));
  background: color-mix(in srgb, var(--warn) 8%, transparent);
}
.tag.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 40%, var(--line));
  background: color-mix(in srgb, var(--danger) 8%, transparent);
}

/* Statistics row */
.statrow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 20px 0;
}
.stat {
  border-top: 2px solid var(--primary);
  padding: 12px 0;
}
.stat b {
  font-size: 24px;
  display: block;
  font-family: var(--fd);
  margin-top: 4px;
  color: var(--primary);
}
.stat span {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Tables */
.table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin: 16px 0;
  border: 1px solid var(--line);
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
  background: var(--paper);
}
th, td {
  text-align: start;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: var(--soft);
}
tr:last-child td { border-bottom: 0; }

/* Timeline */
.timeline {
  border-inline-start: 2px solid var(--line);
  margin: 20px 8px;
  padding-inline-start: 24px;
}
.event {
  position: relative;
  padding: 0 0 24px;
}
.event:before {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--primary);
  inset-inline-start: -30px;
  top: 7px;
}
.event.pending:before {
  background: var(--bg);
  border: 2px solid var(--accent);
}
.event h4 {
  margin: 0 0 4px;
  font-size: 16px;
}
.event p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.55;
}

/* Step Sequence Card */
.step-box {
  display: flex;
  gap: 16px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.step-num {
  font-family: var(--fd);
  font-weight: 700;
  font-size: 20px;
  color: var(--accent);
  flex-shrink: 0;
  width: 32px;
}
.step-content strong {
  display: block;
  font-size: 16px;
  margin-bottom: 4px;
}
.step-content p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
}

/* Accordion / FAQs */
.faq-item {
  border-bottom: 1px solid var(--line);
  padding: 14px 0;
}
.faq-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  padding: 4px 0;
  color: var(--primary);
}
.faq-body {
  padding: 10px 0 6px;
  color: var(--muted);
  font-size: 14.5px;
  line-height: 1.65;
  display: none;
}
.faq-item.open .faq-body {
  display: block;
}
.faq-item.open .faq-icon {
  transform: rotate(180deg);
}

/* Operations Layout */
.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 28px;
}
.side {
  border-inline-end: 1px solid var(--line);
  padding-inline-end: 18px;
}
.side button {
  display: block;
  width: 100%;
  text-align: start;
  border: 0;
  background: transparent;
  padding: 12px 14px;
  color: var(--muted);
  font-size: 14px;
  border-radius: 2px;
  margin-bottom: 4px;
  transition: all 0.15s;
}
.side button:hover {
  color: var(--ink);
  background: var(--soft);
}
.side button.active {
  background: var(--soft);
  color: var(--ink);
  font-weight: 700;
}

/* Alerts and Notices */
.alert {
  border-inline-start: 3px solid var(--accent);
  padding: 14px 18px;
  background: var(--soft);
  font-size: 14px;
  margin: 20px 0;
  line-height: 1.6;
}
.notice {
  padding: 12px 16px;
  border: 1px dashed var(--line);
  margin: 16px 0;
  font-size: 13.5px;
  color: var(--muted);
  background: var(--paper);
}
.metric-note {
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 400;
  display: block;
  margin-top: 2px;
}
.progress {
  height: 6px;
  background: var(--soft);
  margin: 12px 0 18px;
  border-radius: 3px;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  background: var(--primary);
  transition: width 0.3s ease;
}

.workspace-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 18px;
}
.workspace-actions button {
  padding: 9px 15px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-size: 13.5px;
  border-radius: 2px;
  transition: all 0.2s;
}
.workspace-actions button:hover {
  background: var(--soft);
}
.workspace-actions button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}
.mini-field {
  display: grid;
  gap: 5px;
}
.mini-field label {
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 600;
}
.mini-field input, .mini-field select, .mini-field textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 2px;
}

/* Footer */
.footer {
  padding: 36px 0 24px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap: 32px;
  margin-bottom: 30px;
}
.footer-col h5 {
  margin: 0 0 12px;
  font-size: 14px;
  font-family: var(--fd);
  color: var(--primary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.footer-col a {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  text-decoration: none;
  font-size: 13.5px;
}
.footer-col a:hover {
  color: var(--ink);
}
.footer-bottom {
  border-top: 1px solid var(--line);
  padding-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
}

.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* Responsive adjustments */
@media (max-width: 1024px) {
  .footer-grid {
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
}

@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .columns, .layout {
    grid-template-columns: 1fr;
  }
  .grid {
    grid-template-columns: 1fr 1fr;
  }
  .side {
    border-inline-end: 0;
    border-bottom: 1px solid var(--line);
    padding: 0 0 12px;
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .side button {
    white-space: nowrap;
    width: auto;
    margin-bottom: 0;
    margin-inline-end: 6px;
  }
  .statrow {
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .hero-art {
    min-height: 260px;
  }
}

@media (max-width: 768px) {
  .mobile-toggle {
    display: block;
  }
  .nav-links {
    display: none;
    flex-direction: column;
    width: 100%;
    padding: 8px 0;
  }
  .nav-links.mobile-open {
    display: flex;
  }
  .main-nav {
    flex-direction: column;
    align-items: stretch;
  }
  .dropdown-menu {
    position: static;
    box-shadow: none;
    border: 0;
    padding-inline-start: 16px;
    background: transparent;
  }
  .dropdown-wrap:hover .dropdown-menu {
    display: none;
  }
  .dropdown-menu.show {
    display: block;
  }
}

@media (max-width: 680px) {
  .grid, .grid-2, .grid-4 {
    grid-template-columns: 1fr;
  }
  .mini-grid {
    grid-template-columns: 1fr;
  }
  .head {
    align-items: flex-start;
    flex-direction: column;
    padding: 14px 0 16px;
  }
  .head-actions {
    width: 100%;
    justify-content: space-between;
  }
  .top {
    flex-direction: column;
    align-items: flex-start;
    padding: 8px 4vw;
  }
  .switches {
    width: 100%;
    justify-content: flex-start;
  }
  .statrow {
    grid-template-columns: 1fr 1fr;
  }
  .footer-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .btn {
    width: 100%;
  }
  .head-actions .btn {
    width: auto;
  }
}

@media (max-width: 375px) {
  .statrow {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="top">

":["إصلاح أو استبدال الصمام الميترالي والصمام ثلاثي الشرف","تغيير مسار الشريان التاجي الأمامي المنحدر (LIMA to LAD)","استئصال أورام القلب الحميدة (Myxoma) وإغلاق ثقب الحاجز (ASD)"],"documentsRequired":["تقرير إيكو حديث عالي الدقة","أشعة مقطعية على الصدر لمعاينة المسافات بين الضلوع","قسطرة شرايين القلب إن تجاوز عمر المريض 40 عامًا"],"journeySummary":"مكوث 3-4 أيام بالمستشفى ونقاهة 5 أيام بالجناح الفندقي، مع ألم أقل بكثير وتندب جراحي غير ملحوظ.","faqs":[{"q":"هل تصلح تقنية التدخل الطفيف لجميع المرضى؟","a":"تعتمد الملاءمة على تشريح الصدر، وموقع الصمام، والوزن؛ ويحدد الجراح مدى إمكانية إجرائها بعد دراسة الأشعة المقطعية."}]},{"id":"pediatric","name":"جراحة قلب الأطفال والعيوب الخلقية","enName":"Pediatric & Congenital Heart Surgery","desc":"رعاية فائقة التخصص للمواليد والأطفال الذين يعانون من عيوب القلب الخلقية المعقدة.","overview":"إصلاح العيوب الخلقية في بنية القلب والشرايين للأطفال والرضع، في مراكز مجهزة بوحدات رعاية مركزة للأطفال (PICU) وفريق متكامل من أطباء قلب الأطفال وجراحي الرضع.","indications":["رباعي فالوت (Tetralogy of Fallot)","انعكاس وضع الشرايين الكبرى (TGA)","ثقب بين البطينين أو الأذينين (VSD / ASD)","ضيق الشريان الأورطي للرضع (Coarctation of Aorta)"],"documentsRequired":["تقرير إيكو أطفال ملون (Pediatric Echo Report)","أشعة مقطعية أو رنين مغناطيسي على القلب (إن وجد)","تقرير أخصائي الأطفال المتابع وتاريخ الوزن والنمو"],"journeySummary":"إقامة الطفل مع أحد الوالدين بالمستشفى، يتبعها جناح عائلي واسع ومريح بمصر الجديدة أو أكتوبر للمتابعة بعد الخروج.","faqs":[{"q":"هل يسمح للأم أو الأب بالبقاء مع الطفل في الرعاية؟","a":"تسمح المستشفيات الشريكة بزيارات ومرافقة مقننة للوالدين في الرعاية، ويكون الوالدان مع الطفل طوال فترة الإقامة بالجناح."}]},{"id":"ep","name":"كهرباء القلب ومنظمات ضربات القلب","enName":"Electrophysiology & Pacemakers","desc":"تشخيص اضطرابات النظم، والكي بالقسطرة ثلاثية الأبعاد، وزراعة أجهزة تنظيم ومراقبة النبض الحديثة.","overview":"علاج تسارع أو بطء ضربات القلب، ونوبات الإغماء غير المفسرة، باستخدام أحدث أجهزة الخرائط ثلاثية الأبعاد (3D Mapping) وزراعة أجهزة تنظيم ضربات القلب (Pacemakers) وأجهزة الصدمات القابلة للزرع (ICD / CRT).","indications":["الرجفان الأذيني (Atrial Fibrillation)","تسارع نبض القلب فوق البطيني (SVT)","بطء القلب الحاد والإحصار القلبي","قصور القلب المتقدم المحتاج لمنظم CRT"],"documentsRequired":["رسم قلب كهربائي 12 قناة (12-Lead ECG)","تسجيل هولتر 24 أو 48 ساعة لضربات القلب (Holter Monitor)","تقرير إيكو للقلب وتاريخ نوبات الإغماء أو الخفقان"],"journeySummary":"إجراء طفيف التوغل يستدعي مكوث 24-48 ساعة، يليه يومان لبرمجة الجهاز وفحصه قبل العودة.","faqs":[{"q":"هل يمكن السفر بالطائرة بعد زراعة منظم ضربات القلب؟","a":"نعم، يحصل المريض على بطاقة تعريف طبية للجهاز لتمريرها في بوابات المطار، ويكون السفر آمناً تماماً بعد يومين إلى ثلاثة أيام."}]},{"id":"aortic","name":"جراحة الشريان الأورطي وتمدد الأوعية","enName":"Aortic Surgery","desc":"إصلاح تمدد وسلخ الشريان الأورطي بالدعامات المغطاة (TEVAR/EVAR) أو الجراحة الهجينة المتقدمة.","overview":"جراحة دقيقة للشريان الأكبر في الجسم لعلاج التمدد (Aneurysm) أو السلخ (Dissection) لحماية الشريان من الانفجار، وتتم إما بالدعامات القسطارية المغطاة أو الاستبدال الجراحي بأنبوب صناعي متطور.","indications":["تمدد الشريان الأورطي الصدري أو البطني بمقاس يتجاوز 5 سم","سلخ الشريان الأورطي المزمن أو الحاد المستقر","متلازمة مارفان وضعف أنسجة الأورطي"],"documentsRequired":["أشعة مقطعية بالصبغة على كامل الشريان الأورطي الصدري والبطني (CT Aortogram)","تقرير إيكو لفحص صمام الأورطي وجذر الشريان","فحوصات وظائف الكلى وتحاليل التجلط"],"journeySummary":"إقامة متقدمة 5-7 أيام ومتابعة دقيقة لضغط الدم قبل إتاحة إذن الطيران.","faqs":[{"q":"ما هي تقنية الدعامات المغطاة للأورطي (TEVAR)؟","a":"تقنية يتم فيها إدخال دعامة نسيجية مغطاة عبر شريان الفخذ لتغطية منطقة التمدد دون الحاجة لفتح الصدر أو البطن."}]}],"hospitalsSection":{"eyebrow":"المستشفيات والشركاء","title":"مستشفيات قلب تخصصية معتمدة دولياً","desc":"نربط حالتك بأفضل مراكز القلب في مصر الحائزة على اعتمادات دولية مشهود لها، مع الشفافية الكاملة بشأن كل مركز.","disclaimer":"ملاحظة موثوقية: جميع المستشفيات والأطباء المذكورين يتم تدقيق أوراق اعتمادهم واعتماد تراخيصهم سارية المفعول قبل إصدار أي عرض سعر رسمي. لا نختلق إحصائيات أو شراكات غير مؤكدة.","hospitals":[{"name":"مستشفى دار الفؤاد — 6 أكتوبر","type":"مستشفى قلب متخصص ورائد إقليمي","accreditation":"معتمد من اللجنة الدولية المشتركة (JCI) لخمس دورات متتالية","highlights":"وحدات قسطرة هجينة على مدار الساعة، مركز متميز لجراحات القلب المفتوح وزراعة الصمامات، وغرف رعاية مركزة فائقة التجهيز.","location":"مدينة 6 أكتوبر — الجيزة (5 دقائق من أجنحة النيل الفندقية)","specialties":["القسطرة التداخلية ودعامات الشرايين","جراحة مجازة الشرايين CABG","تغيير الصمام بالقسطرة TAVI","جراحة قلب الأطفال"]},{"name":"مستشفى السلام الدولي — المعادي","type":"مجمع طبي دولي متعدد التخصصات","accreditation":"معتمد من JCI والاعتماد الكندي للجودة الصحية","highlights":"إطلالة مباشرة على كورنيش النيل، قسم متميز لفسيولوجيا وكهرباء القلب وزراعة منظمات النبض، وخدمات استقبال وإقامة خاصة بالمرضى الدوليين.","location":"كورنيش النيل — المعادي (7 دقائق من شقق المعادي الفاخرة)","specialties":["كهرباء القلب ومنظمات CRT/ICD","جراحة الصمامات طفيفة التوغل","قسطرة الشرايين الطرفية والأورطي","فحوصات القلب المتقدمة"]},{"name":"المركز التخصصي لجراحات القلب — القاهرة الجديدة","type":"مركز رعاية قلبية جراحية متقدم","accreditation":"معتمد من الهيئة العامة للاعتماد والرقابة الصحية (GAHAR)","highlights":"أحدث غرف عمليات القلب المغلقة، بيئة هادئة بعيدة عن الزحام، أجنحة فندقية ملحقة للمرضى الدوليين والمرافقين.","location":"التجمع الخامس — القاهرة الجديدة (10 دقائق من أجنحة رويال ريزيدنس)","specialties":["جراحة القلب طفيفة التوغل MICS","إصلاح عيوب القلب الخلقية","جراحة تمدد الشريان الأورطي TEVAR"]}],"doctorsStandardTitle":"معايير اختيار الجراحين والاستشاريين","doctorsStandards":["درجة الدكتوراه والزمالة المهنية البريطانية (FRCS) أو البورد الأمريكي أو ما يعادلها دولياً.","سجل موثق بعدد العمليات السنوية ونسب الأمان ومطابقة الممارسات مع الجمعية الأوروبية والكلية الأمريكية لأمراض القلب.","التزام خطي بالإفصاح الكامل عن خيارات العلاج وتفاصيل الرأي السريري دون انحياز تجاري.","إمكانية إجراء استشارة مرئية موثقة للمريض قبل اتخاذ قرار السفر."]},"technologySection":{"eyebrow":"الأجهزة والتقنيات","title":"المصنعون والتقنيات الطبية المعتمدة","desc":"نضمن للمريض أن المواد الطبية المستخدمة في عمليته — كالدعامات والصمامات ومنظمات القلب — تأتي من مصنعين عالميين معتمدين وخاضعين لأعلى معايير الرقابة الدوائية.","notice":"تنبيه الشفافية: أسماء المصنعين والتقنيات معروضة كمرجع إيضاحي للمعايير الهندسية والطبية المعمول بها في مراكز القلب الشريكة، ولا تمثل إعلاناً تجارياً أو شراكة حصرية. يتم إدراج مواصفات الجهاز بدقة في عرض السعر المكتوب للمريض.","categories":[{"title":"صمامات القلب والقسطرة التداخلية","manufacturers":"Edwards Lifesciences · Medtronic · Abbott Vascular","details":"صمامات بيولوجية متقدمة تُركب بالقسطرة (TAVI) مصنوعة من أنسجة نقية مجففة بتقنيات حديثة تمنع التكلس، مع دعامات دوائية تطلق دواء الإيفيروليموس لمنع عودة ضيق الشرايين."},{"title":"منظمات ضربات القلب وأجهزة الصدمات","manufacturers":"Medtronic · Boston Scientific · Biotronik","details":"منظمات CRT و ICD الحديثة القابلة للفحص بالرنين المغناطيسي (MRI-Conditional) والمزودة بأنظمة متابعة لاسلكية تمكن الطبيب من مراقبة النبض عن بعد بعد سفر المريض."},{"title":"أجهزة تصوير القسطرة والخرائط ثلاثية الأبعاد","manufacturers":"Siemens Healthineers · Philips Healthcare · Biosense Webster","details":"معامل قسطرة ثنائية المستوى ذات جرعات إشعاعية منخفضة، مع أنظمة خريطة القلب الكهربية (CARTO 3) لتحديد مسارات النبض الشاذة وكيّها بدقة الملليمتر."},{"title":"دعم الدورة الدموية والرعاية الجراحية المركزة","manufacturers":"Getinge / Maquet · Abbott (CentriMag) · Terumo","details":"أجهزة دعم الدورة الدموية الميكانيكية المؤقتة (ECMO) ومضخات البالون الأورطي لضمان أعلى مستويات الأمان أثناء وبعد الجراحات المعقدة."}]},"journeySection":{"eyebrow":"خارطة الطريق","title":"مسار رحلتك العلاجية من البداية حتى العودة بسلامة","desc":"خطوات محددة بدقة تضمن التدقيق الطبي المستقل والراحة اللوجستية في كل محطة من سفرك.","steps":[{"step":"01","title":"الاستفسار والطلب الأولي","desc":"تتواصل معنا وتشارك بياناتك الأساسية، ويتواصل معك منسق الحالة لشرح كيفية تنظيم الملف دون أي التزام مالي."},{"step":"02","title":"جمع الملف والتقارير الطبية","desc":"مساعدتك في جمع تقارير الإيكو والقسطرة والتحاليل عبر قناة آمنة ومطابقتها للمتطلبات اللازمة للمراجعة."},{"step":"03","title":"المراجعة الطبية المبدئية","desc":"فحص اكتمال المستندات وتلخيص الحالة السريرية وإحالتها للجنة القلب المختصة في مصر."},{"step":"04","title":"مراجعة المستشفى والجراح المعالج","desc":"استلام الرأي السريري المكتوب من الجراح المشرف وتحديد الخطة المقترحة (قسطرة، جراحة، أو متابعة دوائية)."},{"step":"05","title":"عرض الخطة وعرض السعر المفصل","desc":"إرسال عرض مكتوب يوضح تكلفة المستشفى وتكلفة الإقامة الفندقية وما يشمله السعر وما لا يشمله بكل وضوح."},{"step":"06","title":"تنسيق السفر والإقامة الفندقية","desc":"استخراج التأشيرة الطبية الإلكترونية، وحجز الجناح الفندقي المناسب لك ولمرافقك، وتأكيد موعد الدخول."},{"step":"07","title":"الاستقبال ودخول المستشفى وإجراء العملية","desc":"استقبال خاص بالمطار، وتوصيلك للمقر، وإجراء الفحوصات والعملية بنجاح بإشراف فريق التنسيق الميداني."},{"step":"08","title":"النقاهة بالجناح الفندقي والمتابعة بعد العودة","desc":"قضاء فترة النقاهة المقررة، والحصول على تقرير الخروج المعتمد، وجدولة الاستشارات عن بعد بعد عودتك لوطنك."}]},"accommodationSection":{"eyebrow":"الضيافة والسكن اللوجستي","title":"خدمات السفر والإقامة والرعاية المتكاملة","desc":"نعتني بكافة التفاصيل المحيطة بعلاجك لتتفرغ تماماً لصحتك وتعافيك برفقة عائلتك.","services":[{"title":"أجنحة فندقية مجهزة للتعافي","desc":"أجنحة وشقق فندقية مفروشة ومصممة لراحة المريض ومرافقه، على مقربة من المستشفيات، مزودة بمصاعد واسعة وتجهيزات تناسب الحركة بعد الجراحة."},{"title":"استقبال ونقل طبي من المطار","desc":"سيارة خاصة مجهزة تنتظرك بالمطار عند وصولك وتتولى تنقلاتك بين الفندق والمستشفى، مع توفير سيارة إسعاف مجهزة للحالات التي تستدعي ذلك."},{"title":"ترتيبات المرافقين والعائلة","desc":"توفير غرف نوم مستقلة للمرافقين، وتنسيق الإقامة العائلية الواسعة، مع تسهيل كافة متطلبات المعيشة والوجبات الصحية المخصصة لمرضى القلب."},{"title":"منسق شخصي ومساعد على مدار الساعة","desc":"منسق مخصص يرافقك في المواعيد الطبية، ويجيب عن استفساراتك، ويتابع كافة الإجراءات الإدارية داخل المستشفى نيابة عنك."},{"title":"خدمة المتابعة والاستشارات عن بعد","desc":"جدولة مواعيد فيديو مع الطبيب المعالج بعد عودتك لوطنك، ومشاركة تقارير التحاليل الدورية للاطمئنان على استقرار الحالة."}],"stayItems":[{"title":"أجنحة النيل الطبية الفندقية — 6 أكتوبر","distance":"5 دقائق عن مستشفى دار الفؤاد","details":"أجنحة فندقية مفروشة ومجهزة لراحة المريض ومرافقه، مع سرير طبي ومصعد للكراسي المتحركة.","amenities":"سرير طبي قابل للتعديل · غرفة نوم منفصلة للمرافق · تمريض تحت الطلب · تنقل يومي للمستشفى","price":"1,850 ج.م / ليلة (تقديري)"},{"title":"شقق المعادي النيلية — كورنيش النيل","distance":"7 دقائق عن مستشفى السلام الدولي","details":"شقق فندقية واسعة بإطلالة هادئة على النيل، مناسبة للعائلات والمرافقين في فترات النقاهة.","amenities":"شقة غرفتين وصالة · مطبخ مجهز · خدمة استقبال VIP بالمطار · مرافقة على مدار الساعة","price":"2,400 ج.م / ليلة (تقديري)"},{"title":"أجنحة رويال ريزيدنس — القاهرة الجديدة","distance":"10 دقائق عن مراكز القلب التخصصية","details":"إقامة هادئة في حي سكني راقٍ تمنح المريض الخصوصية والراحة بعد الخروج من المستشفى وقبل السفر.","amenities":"بيئة هادئة للتعافي · حديقة خاصة للمشي الموصى به · تعقيم دوري · إنترنت فائق السرعة","price":"2,100 ج.م / ليلة (تقديري)"}],"stayNotice":"تُحجز الإقامة وتُؤكد بناءً على الخطة الطبية وتاريخ الدخول المعتمد من المستشفى."},"faqsSection":{"eyebrow":"الأسئلة الشائعة","title":"كل ما تود معرفته عن تنظيم رحلتك العلاجية","intro":"إجابات واضحة وموثقة عن المراجعة الطبية، والتكاليف، والإقامة، والتأشيرات.","faqs":[{"q":"هل الأطباء والمستشفيات حقيقيون، وكيف أتحقق من مؤهلاتهم؟","a":"لكل طبيب ومستشفى شريك ملف رسمي موثق بالتراخيص والاعتمادات الرسمية (JCI / GAHAR). ولا ندرج أي جراح دون التحقق من شهاداته وتخصصه الدقيق وسجله المهني."},{"q":"هل يؤثر الجانب التجاري للتنسيق على الخطة الطبية؟","a":"أبداً. الفريق الطبي والاستشاري المعالج في المستشفى هو وحده من يحدد الخطة الطبية وفق مصلحة المريض. ونحن نفصح في كل عرض سعر عن رسوم التنسيق بشكل منفصل عن فاتورة المستشفى."},{"q":"ماذا يحدث إذا تغيرت الخطة الطبية أو تطلبت الحالة تمديد الإقامة؟","a":"يرافق كل عرض سعر سياسة مكتوبة توضح سياسة التمديد والتكاليف الإضافية المحتملة، ولا يتم اتخاذ أي إجراء إضافي إلا بموافقة المريض الخطية والاطلاع المسبق."},{"q":"كيف يتم سداد التكاليف؟","a":"تُدفع تكاليف العملية والفحوصات للمستشفى مباشرة وفق فواتير رسمية معتمدة، بينما تُسدد رسوم السكن والإقامة والانتقالات لخدمات التنسيق وفق الباقة المختارة."},{"q":"هل يحتاج المريض ومرافقه تأشيرة دخول لمصر؟","a":"يحصل مواطنو دول الخليج والعديد من الدول على تأشيرة دخول فورية أو إلكترونية بسهولة. وللجنسيات الأخرى، نقوم بإصدار خطاب دعوة طبية رسمي لتسهيل استخراج التأشيرة العلاجية."},{"q":"من أتواصل معه إذا احتجت مساعدة طارئة في مصر؟","a":"منسقك الشخصي متاح معك على مدار الساعة طوال مكوثك في مصر، بالإضافة لخط ساخن مع طوارئ المستشفى الشريك."}]},"aboutPage":{"eyebrow":"عن المنصة","title":"تنسيق طبي متخصص في جراحات وقسطرة القلب في مصر","desc":"تأسست المنصة بهدف سد الفجوة بين المرضى الدوليين وأرقى الكفاءات الطبية والمستشفيات المتخصصة في مصر، مع توفير تجربة سفر مريحة وإقامة فندقية تراعي أدق الاحتياجات الصحية.","missionTitle":"مهمتنا وقيمنا","mission":"تمكين المرضى وعائلاتهم من اتخاذ قرارات صحية مبنية على معرفة دقيقة ومراجعات طبية محايدة، مع الالتزام التام بالشفافية المالية وفصل القرارات الطبية عن المصالح اللوجستية.","features":[{"title":"تركيز تخصصي خالص","text":"نركز حصرياً على أمراض وجراحات وقسطرة القلب لضمان أعلى درجات الإتقان والخبرة الدقيقة."},{"title":"شفافية مالية مطلقة","text":"لا توجد رسوم خفية. نوضح للمريض ما يُسدد للمستشفى مباشرة وما يخص السكن والانتقالات."},{"title":"أمان المريض أولاً","text":"لا نقبل أي حالة دون دراسة تقاريرها من لجنة استشارية للتأكد من ملاءمتها للسفر (Fit to Fly)."}]},"contactPage":{"eyebrow":"تواصل معنا","title":"نحن هنا لمساعدتك والإجابة عن جميع استفساراتك","desc":"تواصل مع فريق التنسيق الطبي للحصول على استشارة مبدئية أو الاستفسار عن تفاصيل السفر والإقامة.","phoneLabel":"الهاتف وواتساب","phone":"+20 11 2739 2979","emailLabel":"البريد الإلكتروني","email":"coordination@cardiac-egypt.com","addressLabel":"مكتب التنسيق الرئيسي","address":"القاهرة والجيزة — جمهورية مصر العربية","formTitle":"أرسل رسالة أو استفساراً","sendBtn":"إرسال الاستفسار (معاينة)"},"privacyPage":{"eyebrow":"الخصوصية وحماية البيانات","title":"سياسة الخصوصية وسرية الملفات الطبية","intro":"نلتزم بأعلى معايير السرية الطبية وحماية البيانات الشخصية والصحية لمرضانا وفق المعايير والقوانين المعمول بها.","sections":[{"title":"1. جمع واستخدام البيانات الطبية","body":"لا يتم استخدام البيانات الصحية أو التقارير إلا لغرض المراجعة السريرية من قِبل الأطباء الاستشاريين المخولين والمستشفيات الشريكة لتحديد خيارات العلاج."},{"title":"2. سرية التقارير والفحوصات","body":"تُرسل التقارير عبر قنوات مشفرة ولا يتم نشرها أو مشاركتها مع أي أطراف ثالثة غير مشاركة في رحلة العلاج والتنسيق."},{"title":"3. حقوق المريض","body":"يحق للمريض طلب حذف ملفاته أو سحب موافقته في أي وقت قبل إتمام التعاقد دون أي مساءلة أو التزام."}]},"termsPage":{"eyebrow":"الشروط والسياسات","title":"الشروط والأحكام العامة وسياسة الإلغاء","intro":"تنظم هذه الشروط العلاقة بين المريض والمنصة كجهة تنسيق رعاية وإقامة وسفر.","sections":[{"title":"1. طبيعة الخدمة وحدود المسؤولية","body":"المنصة جهة تنسيق لوجستي وإداري وسياحي طبي. القرارات السريرية والتشخيصات والإجراءات الطبية والجراحية هي مسؤولية المستشفى المرخص والطبيب المعالج حصرياً."},{"title":"2. عروض الأسعار والصلاحية","body":"عروض الأسعار المبدئية مبنية على مراجعة التقارير المرفقة وتعتبر تقديرية لحين إجراء الفحص السريري المباشر وتأكيد الخطة من المستشفى."},{"title":"3. سياسة الإلغاء وتعديل المواعيد","body":"تخضع شروط الإلغاء والاسترداد لسياسة المستشفى ومكان الإقامة المحجوز، وتوضح للمريض كتابةً قبل سداد أي مبالغ مقدمة."}]}},
  en: {"langCode":"en","dir":"ltr","brandName":"CARDIAC CARE EGYPT","brandSub":"CARDIAC CARE & ACCOMMODATION","topLabel":"Interactive preview — illustrative data only","modeTag":"Prototype","headerCta":"Request an Initial Medical Assessment","footerNote":"Design and workflow mockup only; it does not submit data or represent a live medical system.","emergency":"Medical emergency? If you have severe chest pain or shortness of breath, contact local emergency services immediately and do not wait for this website.","nav":{"home":"Public Website","specialties":"Cardiac Specialties","hospitals":"Hospitals & Doctors","technology":"Medical Technology","journey":"Patient Journey","accommodation":"Travel & Stay","assessment":"Assessment Request","portal":"Patient Portal","ops":"Operations Hub","finance":"Finance & Margin","about":"About Us","contact":"Contact","faqs":"FAQs","privacy":"Privacy Policy","terms":"Terms & Conditions"},"home":{"eyebrow":"An initial medical review, with no commitment to travel","heroTitle":"Share your medical reports and understand your options before deciding to travel","heroDesc":"A specialized cardiac team in Egypt reviews your file and provides written preliminary feedback and clear treatment options. There is no fee for this step. If you choose to proceed, our team coordinates clinical care, hospital-adjacent recovery suites, and transport through your safe return.","ctaPrimary":"Request an Initial Medical Assessment","ctaSecondary":"Explore Specialties & Options","heroArtBadge":"CARDIAC CARE · EGYPT","heroArtTitle":"A clearer journey, starting with thorough clinical review.","heroArtSub":"Coordinating clinical care, recovery suites and travel around each patient's individual needs.","heroArtNote":"01 / 05 — Clinical review before any financial commitment","coordinationEyebrow":"Our Role in Your Journey","coordinationTitle":"Dedicated Coordination Centered on Safety and Transparency","coordinationDesc":"We are a specialized coordination team for cardiac medical travel and recovery in Egypt. We do not make independent medical decisions; instead, we connect you with verified senior cardiac surgeons, accredited hospitals, and seamless travel logistics.","coordinationPillars":[{"num":"01","title":"Thorough File Review","text":"We verify document completeness and forward your diagnostic reports to our surgical review board with zero preliminary assessment fees."},{"num":"02","title":"Transparent Pricing","text":"Clear written quotations detailing hospital inpatient fees separately from accommodation and coordination services, with no hidden margins."},{"num":"03","title":"Recovery Hospitality","text":"Hospital-adjacent hotel suites and serviced residences equipped for post-procedure cardiac recovery, with companion rooms and nursing support."},{"num":"04","title":"Dedicated Personal Care","text":"A named coordinator greets you at the airport, assists with hospital administration, and remains your point of contact through your safe return home."}],"specialtiesEyebrow":"Surgical Disciplines","specialtiesTitle":"Seven Specialized Cardiac Disciplines","specialtiesIntro":"Select the specialty closest to your clinical diagnosis to review procedure details, required reports, and coordination milestones.","hospitalsEyebrow":"Hospitals & Medical Professionals","hospitalsTitle":"Accredited Heart Centers and Leading Cardiac Surgeons","hospitalsIntro":"We work exclusively with internationally accredited hospitals (JCI and GAHAR certified) and surgeons holding verified UK, US, or European fellowships.","techEyebrow":"Clinical Infrastructure","techTitle":"Advanced Cardiac Technology & Global Device Manufacturers","techIntro":"Our partner centers utilize state-of-the-art hybrid operating rooms, advanced catheterization laboratories, and certified medical devices from established global manufacturers.","journeyEyebrow":"How the Journey Works","journeyTitle":"An 8-Stage Pathway from Initial Inquiry Through Safe Return","journeyIntro":"Every milestone is clearly defined with clinical reviews and dedicated logistical oversight to ensure complete safety and peace of mind.","stayEyebrow":"Logistics & Hospitality","stayTitle":"Where You and Your Companion Will Stay in Cairo","stayIntro":"Curated recovery suites and serviced residences minutes away from partner hospitals in 6th of October, Maadi, and New Cairo.","faqEyebrow":"Common Concerns Answered","faqTitle":"Common Patient Concerns, Answered with Total Clarity","faqIntro":"Traveling abroad for cardiac treatment is a major decision. We provide upfront, transparent answers before you commit.","finalCtaTitle":"Ready to Understand Your Treatment Options?","finalCtaDesc":"Submit your basic contact information and existing reports. Our case coordinator will reach out promptly to outline next steps with zero obligation.","finalCtaBtn":"Request an Initial Medical Assessment Now"},"specialtiesList":[{"id":"interventional","name":"Interventional Cardiology & Stents","enName":"Interventional Cardiology","desc":"Coronary angiography, balloon angioplasty, and drug-eluting stent placement with rapid recovery and minimal hospital stay.","overview":"Interventional cardiology provides catheter-based evaluation and revascularization of narrowed or blocked coronary arteries without the need for open-chest surgery. Performed predominantly via transradial (wrist) access, offering rapid ambulation and short hospitalization.","indications":["Stable and unstable angina pectoris","Acute coronary syndromes & myocardial infarction","Multivessel coronary artery disease","Restenosis assessment of prior stents"],"documentsRequired":["Prior coronary angiogram report and imaging disc (DICOM CD)","Recent resting echocardiogram (Echo) report","12-lead ECG, recent kidney function (Creatinine/eGFR), and blood glucose"],"journeySummary":"Single-night hospital inpatient stay in most cases, followed by 2 to 3 days in our quiet recovery suite prior to flight clearance.","faqs":[{"q":"How long is the procedure and post-procedure recovery?","a":"The procedure typically takes 45 to 90 minutes. Patients usually walk within hours and are cleared for return air travel within 4 to 5 days."},{"q":"What types of stents are utilized?","a":"Partner hospitals utilize latest-generation drug-eluting stents (Everolimus/Zotarolimus-eluting) with proven clinical efficacy and minimal restenosis rates."}]},{"id":"cabg","name":"Coronary Artery Bypass Grafting (CABG)","enName":"Coronary Artery Bypass Grafting","desc":"Surgical revascularization for complex, multivessel coronary disease performed by fellowship-trained cardiac surgeons.","overview":"Coronary Artery Bypass Grafting (CABG) restores adequate myocardial blood perfusion by grafting healthy arteries or veins (such as internal mammary arteries or saphenous veins) to bypass severe coronary blockages. Performed with on-pump or beating-heart (off-pump) techniques.","indications":["Left main coronary artery stenosis","Triple vessel disease with diminished left ventricular function","Complex diabetic coronary artery disease"],"documentsRequired":["Coronary angiography disc (DICOM CD)","Comprehensive echocardiogram assessing ejection fraction (LVEF)","Multislice coronary CT scan (if available)","Detailed medical summary of comorbidities and current medication regimen"],"journeySummary":"5 to 7 days inpatient stay (including ICU step-down), followed by 7 to 10 days in an equipped recovery suite before fit-to-fly certification.","faqs":[{"q":"When is it safe to fly home after bypass surgery?","a":"The operating surgical team evaluates sternal stability, hemoglobin levels, and rhythm stability, typically clearing patients for flight between 10 and 14 days post-op."},{"q":"Is home nursing available at our recovery residence?","a":"Yes, we arrange scheduled nursing visits to check vitals, manage wound dressings, and guide respiratory physiotherapy at your suite."}]},{"id":"valves","name":"Heart Valve Surgery (TAVI / SAVR)","enName":"Heart Valve Surgery","desc":"Surgical valve repair and replacement or transcatheter aortic valve implantation (TAVI) for high-risk and elderly patients.","overview":"Comprehensive treatment for severe aortic and mitral valve stenosis or regurgitation. Delivered either via transcatheter aortic valve implantation (TAVI) without median sternotomy, or through surgical repair or replacement using advanced bioprosthetic or mechanical valves.","indications":["Severe calcific aortic stenosis in elderly or frail patients","Severe symptomatic mitral regurgitation","Prosthetic valve deterioration or chronic endocarditis"],"documentsRequired":["Dedicated TAVI protocol contrast CT angiogram","Transesophageal echocardiogram (TEE) or 3D transthoracic echo","Full laboratory panel including renal, hepatic, and coagulation profiles"],"journeySummary":"TAVI involves 48 hours of inpatient observation with rapid recovery, whereas surgical valve replacement involves 5 to 7 days hospital stay followed by structured recovery.","faqs":[{"q":"What is the key advantage of TAVI over conventional valve surgery?","a":"TAVI avoids open-heart surgery and cardiopulmonary bypass, accessing the valve transfemorally through the groin, resulting in drastically reduced recovery time."},{"q":"How long do modern biological heart valves last?","a":"Contemporary anti-calcification treated pericardial tissue valves typically provide durability of 15 to 20 years without lifelong anticoagulation requirements."}]},{"id":"mics","name":"Minimally Invasive Cardiac Surgery (MICS)","enName":"Minimally Invasive Cardiac Surgery","desc":"Valve surgery and single-vessel bypass performed through small lateral intercostal mini-thoracotomies.","overview":"Minimally Invasive Cardiac Surgery achieves surgical valve repairs, replacements, and coronary grafts through small 5-6 cm intercostal incisions between the ribs, avoiding full sternotomy, minimizing operative blood loss, and expediting functional recovery.","indications":["Mitral and tricuspid valve repair or replacement","Single-vessel bypass (LIMA to LAD)","Atrial septal defect (ASD) closure and benign cardiac tumor resection"],"documentsRequired":["High-definition echocardiogram report","Contrast chest CT angiogram evaluating intercostal anatomy and femoral vessel caliber","Coronary angiography for patients over 40"],"journeySummary":"3 to 4 days hospital stay followed by 5 days in our recovery suite, with significantly reduced pain and barely visible cosmetic scarring.","faqs":[{"q":"Is every cardiac patient a candidate for MICS?","a":"Suitability depends on thoracic anatomy, vascular access, and cardiac pathology. The surgical board evaluates CT scans to determine whether minimally invasive access is safe."}]},{"id":"pediatric","name":"Pediatric & Congenital Heart Surgery","enName":"Pediatric & Congenital Heart Surgery","desc":"Specialized pediatric surgical correction for infants and children with complex structural and congenital heart defects.","overview":"Corrective and palliative surgical treatment for congenital heart defects in infants and pediatric patients, supported by dedicated pediatric cardiac intensive care units (PICU) and multidisciplinary pediatric cardiologists and intensivists.","indications":["Tetralogy of Fallot","Transposition of the Great Arteries (TGA)","Ventricular and atrial septal defects (VSD / ASD)","Coarctation of the aorta"],"documentsRequired":["Color Doppler pediatric echocardiogram report","Cardiac MRI or multidetector CT (if available)","Pediatrician growth chart, birth history, and current clinical summary"],"journeySummary":"Parental rooming-in during inpatient recovery, followed by spacious family accommodation in quiet residential districts in Cairo.","faqs":[{"q":"Can parents stay with the child throughout hospitalization?","a":"Yes, partner hospitals provide parental rooming-in within inpatient pediatric suites, and structured daily visiting protocols in the pediatric ICU."}]},{"id":"ep","name":"Electrophysiology & Pacemaker Therapy","enName":"Electrophysiology & Pacemakers","desc":"Arrhythmia mapping, catheter radiofrequency/cryoablation, and advanced pacemaker/ICD/CRT device implantation.","overview":"Diagnostic electrophysiology studies and curative catheter ablation of rhythm disturbances using advanced 3D anatomical mapping, alongside surgical implantation of permanent pacemakers, implantable cardioverter-defibrillators (ICD), and biventricular devices (CRT).","indications":["Paroxysmal and persistent atrial fibrillation","Supraventricular tachycardias (SVT, WPW syndrome)","Symptomatic sick sinus syndrome and high-grade AV block","Severe congestive heart failure requiring cardiac resynchronization (CRT-D)"],"documentsRequired":["12-lead ECG during rhythm episodes","24-hour or 48-hour Holter monitoring report","Transthoracic echocardiogram assessing ventricular chamber dimensions and ejection fraction"],"journeySummary":"Minimally invasive catheter procedure requiring 24 to 48 hours hospital stay, followed by 2 days for device programming and baseline stability testing.","faqs":[{"q":"Can I travel by air with an implanted pacemaker or defibrillator?","a":"Yes. Patients receive an international device identification card for airport security, and air travel is completely safe 48 to 72 hours post-implantation."}]},{"id":"aortic","name":"Aortic Arch & Aneurysm Surgery","enName":"Aortic Surgery","desc":"Surgical and endovascular repair (TEVAR / EVAR) for thoracic and abdominal aortic aneurysms and dissections.","overview":"Surgical and catheter-based reconstruction of the aorta—the body's primary arterial vessel—treating aneurysmal dilation or chronic dissection through open graft replacement or stent-graft endovascular exclusion (TEVAR/EVAR) to avert rupture.","indications":["Thoracic aortic aneurysm exceeding 5.0 to 5.5 cm","Chronic type B aortic dissection with aneurysmal degeneration","Marfan syndrome and connective tissue function d() { return dataStore[lang]; }

function toggleLang() {
  lang = (lang === "ar" ? "en" : "ar");
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === "ar" ? "rtl" : "ltr");
  render();
}

function setTheme(v) {
  theme = v;
  document.body.classList.toggle("editorial", v === "editorial");
  document.getElementById("nileBtn").classList.toggle("active", v === "nile");
  document.getElementById("editorialBtn").classList.toggle("active", v === "editorial");
}

function showPage(pageId, extraParam) {
  activePage = pageId;
  if (pageId === "specialty" && extraParam) {
    selectedSpecialtyId = extraParam;
  }
  // Close mobile nav if open
  const navLinks = document.getElementById("navLinksContainer");
  if (navLinks) navLinks.classList.remove("mobile-open");
  
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function toggleMobileNav() {
  const navLinks = document.getElementById("navLinksContainer");
  if (navLinks) navLinks.classList.toggle("mobile-open");
}

function toggleFaqItem(el) {
  const item = el.closest(".faq-item");
  if (item) item.classList.toggle("open");
}

function formatCurr(egpAmount) {
  const curr = currencyRates[activeCurrency];
  const val = Math.round(egpAmount * curr.rate);
  const sym = (lang === "ar" ? curr.arSym : curr.enSym);
  return val.toLocaleString() + " " + sym;
}

function setCurrency(c) {
  activeCurrency = c;
  render();
}

function toggleFinanceDemo() {
  financeDemo = !financeDemo;
  render();
}

function advanceCase() {
  if (caseStage >= 3) {
    const el = document.getElementById("opsNotice");

    return;

  caseStage++;
  render();
}

function resetCase() {
  caseStage = 0;
  opsSection = 0;
  render();
}

    '<button class="nav-btn ' + (activePage === "accommodation" ? "active" : "") + '" onclick="showPage(\'accommodation\')">' + n.accommodation + '</button>',

    '<button class="nav-btn ' + (activePage === "portal" ? "active" : "") + '" onclick="showPage(\'portal\')">' + n.portal + '</button>',
    '<button class="nav-btn ' + (activePage === "ops" ? "active" : "") + '" onclick="showPage(\'ops\')">' + n.ops + '</button>',
    '<button class="nav-btn ' + (activePage === "finance" ? "active" : "") + '" onclick="showPage(\'finance\')">' + n.finance + '</button>'

  document.getElementById("navLinksContainer").innerHTML = navHtml;
  document.getElementById("mobileMenuBtn").textContent = (isAr ? "القائمة الرئيسية ☰" : "Main Navigation ☰");
}

    d().specialtiesList.map(s =>

    '    <a href="javascript:void(0)" onclick="showPage(\'assessment\')">' + n.assessment + '</a>',
    '    <a href="javascript:void(0)" onclick="showPage(\'portal\')">' + n.portal + '</a>',

/* Main Master Render */
function render() {
  const cur = d();
  document.getElementById("topLabel").textContent = cur.topLabel;
  document.getElementById("brandName").textContent = cur.brandName;
  document.getElementById("brandSub").textContent = cur.brandSub;
  document.getElementById("modeTag").textContent = cur.modeTag;
  document.getElementById("headerCta").textContent = cur.headerCta;
  document.getElementById("langBtn").textContent = (lang === "ar" ? "English" : "العربية");
  document.getElementById("nileBtn").textContent = (lang === "ar" ? "أخضر النيل" : "Nile Green");
  document.getElementById("editorialBtn").textContent = (lang === "ar" ? "تحريري طبي" : "Medical Editorial");

  renderNav();
  renderFooter();

  const views = {
    home: renderHome,
    specialties: renderSpecialtiesIndex,
    specialty: renderSpecialtyDetail,
    hospitals: renderHospitals,
    technology: renderTechnology,
    journey: renderJourney,
    accommodation: renderAccommodation,
    assessment: renderAssessment,
    about: renderAbout,
    contact: renderContact,
    faqs: renderFaqsPage,
    privacy: renderPrivacy,
    terms: renderTerms,
    portal: renderPortal,
    ops: renderOps,
    finance: renderFinance
  };

  const renderFn = views[activePage] || renderHome;
  document.getElementById("content").innerHTML = renderFn();
}

// Initial render
render();

</script>
